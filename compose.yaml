# Local infrastructure for Akita: `docker compose up -d`
# Values match apps/akita-api/.env.example. Override any of them in a root .env file.
name: akita

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-akita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akita}
      POSTGRES_DB: ${POSTGRES_DB:-akita}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Official MinIO images are no longer published; pgsty/minio is a community build of the MinIO source.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-akita}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-akita-secret}
      # MinIO applies CORS server-wide: allow the web app to upload with presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off job: create the bucket once MinIO is healthy.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-akita}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-akita-secret}
      S3_BUCKET: ${S3_BUCKET:-akita}
    entrypoint: >
      sh -c 'mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
      && mc mb --ignore-existing "local/$$S3_BUCKET"'
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
